[package]
name = "xiaoyin-desktop"
version = "0.1.71"
description = "Xiaoyin enterprise desktop assistant"
authors = ["InStudio"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "xiaoyin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
windows-no-console = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
csv = "1.4.0"
dunce = "1.0.5"
flate2 = "1.1.2"
futures-util = "0.3.31"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "native-tls", "query", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
semver = "1.0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tar = "0.4.44"
tiny_http = "0.12.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-process = "=2.3.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updater = "=2.10.1"
keyring = "4.1.6"
tokio = { version = "1", features = ["time"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
uuid = { version = "=1.25.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
