[package]
name = "xiaoyin-desktop"
version = "0.1.3"
description = "Xiaoyin enterprise desktop assistant"
authors = ["InStudio"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "xiaoyin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1.1.2"
futures-util = "0.3.31"
percent-encoding = "2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "native-tls", "query", "stream"] }
semver = "1.0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tar = "0.4.44"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-process = "=2.3.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-updater = "=2.10.1"
keyring = "4.1.6"
