# Xiaoyin policy and product overlay for the upstream full `sdk` profile.
# Stable Harness capabilities stay owned by dsh-base; this file only replaces
# deployment policy and adds desktop-owned bridges and business tools.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
    streamIdleTimeoutMs: 172800000

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是公司内部办公助手小胤。先理解用户意图，再选择交互方式：直接问答就直接回答；需要完成目标就像 Codex 一样规划、调用工具、核对结果并交付；只有缺少会阻止安全继续的关键信息时才调用 ask_user_question，不要用固定关键词、消息长度或工作目录状态替代意图判断，也不要为直接问答制造等待状态。复杂任务先判断依赖关系，再决定串行、并行或委派；不要把每个技能机械映射成一个 Agent。主 Agent 负责目标、权限、整合与验收，子 Agent 只承担边界清晰且可独立完成的工作。不得让多个 Agent 同时修改同一文件或同一外部资源。只有当前运行时真实提供的工具和连接器才可使用；实时企业数据必须来自成功的工具调用，禁止凭模型知识编造。'

- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 3

# When the desktop has explicit authorized roots, Xiaoyin's product file
# adapter is the only model-facing filesystem surface. The upstream fs tools
# remain available for plain workspace sessions, but never compete with
# local_files_* in an authorized multi-root task.
- id: tool-fs
  disabled: !!js "(() => { try { const roots = JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]'); return Array.isArray(roots) && roots.length > 0 } catch { return true } })()"

- id: tool-fs-search
  disabled: !!js "(() => { try { const roots = JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]'); return Array.isArray(roots) && roots.length > 0 } catch { return true } })()"

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? dshHomePath('sessions')
    compression: none

# Keep the official user-settings and credential documents inside the
# employee-scoped DSH_HOME supplied by the desktop process. Explicit paths
# make the isolation contract independent of upstream provider defaults.
- id: settings
  config:
    path: !!js dshHomePath('settings.yaml')

- id: credentials
  config:
    path: !!js dshHomePath('.credentials.yaml')

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-query.sqlite')
    openAt: first-search

# Xiaoyin already stores content-addressed images in its authorized attachment
# store. Keep one attachment backend until existing desktop references migrate.
- id: attachment-local
  disabled: true

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  disabled: !!js process.env.XIAOYIN_ALLOW_SHELL === 'false'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: ask
    defaultPreset: workspace-write

- id: bash-sandbox
  disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_ALLOW_SHELL === 'false'
  config:
    timeoutMs: 300000

- id: pwsh-sandbox
  disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_ALLOW_SHELL === 'false'

- id: tool-bash
  disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_ALLOW_SHELL === 'false'

- id: tool-pwsh
  disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_ALLOW_SHELL === 'false'

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js JSON.parse(process.env.DSH_CUSTOM_SKILL_DIRS ?? '[]')
    watchFollowSymlinks: false

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: true
    backgroundMode: continuable
    persona: '你是小胤委派的子 Agent。只完成收到的独立任务，返回事实、产物与验证结果；不要再次委派。'
    toolFilter:
      deny: [subagent, subagent_fork, send_message, interrupt_agent, list_agents]
    maxDepth: 1

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    maxDepth: 1

- id: tool-result-pruner
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: spill-policy
  config:
    maxInlineBytes: 50000

- id: tool-todo
  config:
    allowParallelInProgress: true

- id: tool-ralph
  config:
    subagentProvider: spawn
    maxRounds: 32

- id: repeat-tool-reminder
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: web-search-deepseek
  config:
    # Web search uses the Anthropic-compatible DeepSeek endpoint, which may
    # differ from the chat/LiteLLM endpoint used by the desktop task runtime.
    baseURL: !!js process.env.DEEPSEEK_SEARCH_BASE_URL ?? 'https://api.deepseek.com/anthropic/v1'

- id: tools
  config:
    # PTC executes model-written TypeScript with Bash-equivalent authority.
    # Native remains the product default; deployments opt into ptc or both.
    mode: !!js process.env.XIAOYIN_TOOLS_MODE ?? 'native'

- insert:
    # Persistent PTY is a separate capability from bounded shell calls. These
    # are product overlay rows because the upstream sdk profile has no terminal
    # rows to replace. Keeping them in insert makes the mount explicit and
    # prevents a silent "entry not found" patch warning.
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
      disabled: !!js process.env.XIAOYIN_ALLOW_SHELL === 'false'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_ALLOW_SHELL === 'false'
      config:
        shellDialect: bash
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_ALLOW_SHELL === 'false'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
      disabled: !!js process.env.XIAOYIN_ALLOW_SHELL === 'false'
      config:
        enableRunInBackground: true
        maxResultBytes: 262144

    # `present` publishes source-file references through the official Session
    # filesystem. With explicit Xiaoyin roots the product file bridge remains
    # the sole filesystem surface, so this tool is disabled to avoid a second
    # path/authorization model.
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
      disabled: !!js "(() => { try { const roots = JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]'); return Array.isArray(roots) && roots.length > 0 } catch { return true } })()"
      config:
        maxFiles: 8

    # Harness reminders are Session-local follow-ups. They complement, but do
    # not replace, Xiaoyin's cross-restart Cron and external notification layer.
    - id: session-schedule
      name: '@deepseek-ai/dsh-schedule'

    # Canonical dsh-session mentions are resolved by Harness into bounded,
    # immutable, untrusted snapshots. This is read-only cross-session context
    # and does not replace Xiaoyin's task history or product projection.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
      disabled: !!js process.env.XIAOYIN_ENABLE_SESSION_REFERENCES === 'false'
      config:
        maxReferences: 3
        candidateLimit: 50

    - id: local-attachments
      name: '../dist/local-attachment-store-plugin.js'
      config:
        root: !!js process.env.XIAOYIN_ATTACHMENT_ROOT ?? './.xiaoyin/attachments'

    - id: desktop-approval
      name: '../dist/desktop-approval-plugin.js'

    - id: desktop-user-question
      name: '../dist/desktop-user-question-plugin.js'

    - id: desktop-plan-mode
      name: '../dist/desktop-plan-mode-plugin.js'

    - id: session-projection-bridge
      name: '../dist/session-projection-plugin.js'

    - id: xiaoyin-product-projections
      name: '../dist/xiaoyin-projections-plugin.js'

    - id: xiaoyin-transcript-projection
      name: '../dist/transcript-projection.js'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: tool-session-query
      name: '../dist/session-query-compat-plugin.js'
      # The compat layer preserves the official tools and only makes its
      # optional prompt section resilient to rc.2's inactive-context bug.
      disabled: !!js process.env.XIAOYIN_ENABLE_SESSION_QUERY_TOOLS === 'false'
      config:
        maxSearchResults: 50
        searchTimeoutMs: 30000

    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'
      disabled: !!js "!['ptc', 'both'].includes(process.env.XIAOYIN_TOOLS_MODE ?? 'native')"
      config:
        computeMs: 60000
        maxWallMs: 600000
        maxOutputBytes: 16777216
        maxOldGenerationSizeMb: 256

    # LSP is mounted only with an explicit non-empty server map. The desktop
    # never guesses executables or starts language servers behind the user.
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
      disabled: !!js "(() => { try { const servers = JSON.parse(process.env.XIAOYIN_LSP_SERVERS ?? '{}'); return process.env.XIAOYIN_ALLOW_LSP === 'false' || !servers || typeof servers !== 'object' || Array.isArray(servers) || Object.keys(servers).length === 0 } catch { return true } })()"

    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      disabled: !!js "(() => { try { const servers = JSON.parse(process.env.XIAOYIN_LSP_SERVERS ?? '{}'); return process.env.XIAOYIN_ALLOW_LSP === 'false' || !servers || typeof servers !== 'object' || Array.isArray(servers) || Object.keys(servers).length === 0 } catch { return true } })()"
      config:
        servers: !!js JSON.parse(process.env.XIAOYIN_LSP_SERVERS ?? '{}')

    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'
      disabled: !!js "(() => { try { const servers = JSON.parse(process.env.XIAOYIN_LSP_SERVERS ?? '{}'); return process.env.XIAOYIN_ALLOW_LSP === 'false' || !servers || typeof servers !== 'object' || Array.isArray(servers) || Object.keys(servers).length === 0 } catch { return true } })()"

    # Hooks can run arbitrary local commands and therefore require an explicit
    # config path. Missing paths leave no hook listener mounted.
    - id: hooks-codex
      name: '@deepseek-ai/dsh-hooks-codex'
      disabled: !!js "process.env.XIAOYIN_ALLOW_HOOKS === 'false' || !process.env.XIAOYIN_CODEX_HOOKS_CONFIG"
      config:
        configPath: !!js process.env.XIAOYIN_CODEX_HOOKS_CONFIG ?? ''

    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      disabled: !!js "process.env.XIAOYIN_ALLOW_HOOKS === 'false' || !process.env.XIAOYIN_CLAUDE_HOOKS_CONFIG"
      config:
        configPath: !!js process.env.XIAOYIN_CLAUDE_HOOKS_CONFIG ?? ''

    # External agent runtimes are opt-in. Each gets a static tool and isolated
    # provider so unavailable accounts or executables are never advertised.
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      disabled: !!js process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || process.env.XIAOYIN_ENABLE_CODEX_SUBAGENT !== 'true'
      config:
        providerName: codex
        permissionMode: never

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || process.env.XIAOYIN_ENABLE_CODEX_SUBAGENT !== 'true'
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot

    - id: subagent-claude
      name: '@deepseek-ai/dsh-subagent-claude-code'
      disabled: !!js process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || process.env.XIAOYIN_ENABLE_CLAUDE_SUBAGENT !== 'true'
      config:
        providerName: claude-code
        permissionMode: dontAsk

    - id: tool-subagent-claude
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || process.env.XIAOYIN_ENABLE_CLAUDE_SUBAGENT !== 'true'
      config:
        provider: claude-code
        toolName: subagent_claude
        backgroundMode: one-shot

    - id: subagent-acp
      name: '@deepseek-ai/dsh-subagent-acp'
      disabled: !!js "process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || !process.env.XIAOYIN_ACP_COMMAND"
      config:
        providerName: acp
        command: !!js process.env.XIAOYIN_ACP_COMMAND ?? ''
        args: !!js JSON.parse(process.env.XIAOYIN_ACP_ARGS ?? '[]')
        permission: reject

    - id: tool-subagent-acp
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js "process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || !process.env.XIAOYIN_ACP_COMMAND"
      config:
        provider: acp
        toolName: subagent_acp
        backgroundMode: one-shot

    - id: subagent-dsh
      name: '@deepseek-ai/dsh-subagent-dsh-sdk'
      disabled: !!js process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || process.env.XIAOYIN_ENABLE_DSH_SUBAGENT !== 'true'
      config:
        providerName: dsh-sdk
        profile: sdk
        patches: []
        dshHome: !!js dshHomePath('subagents/dsh')
        provider: deepseek-official
        model: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        env:
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY ?? ''
          DSH_TELEMETRY_DISABLED: '1'

    - id: tool-subagent-dsh
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: !!js process.env.XIAOYIN_ALLOW_EXTERNAL_AGENTS === 'false' || process.env.XIAOYIN_ENABLE_DSH_SUBAGENT !== 'true'
      config:
        provider: dsh-sdk
        toolName: subagent_dsh
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: task-outcome
      name: '../dist/task-outcome-plugin.js'

    - id: managed-mcp
      name: '../dist/managed-mcp-plugin.js'
      config:
        connectors: !!js JSON.parse(process.env.XIAOYIN_MCP_CONNECTORS ?? '[]')
        employeeBearerTokenEnv: XIAOYIN_EMPLOYEE_BEARER_TOKEN

    - id: enterprise-knowledge
      name: '../dist/knowledge-plugin.js'
      config:
        endpoint: !!js process.env.XIAOYIN_KNOWLEDGE_ENDPOINT ?? ''
        employeeIdEnv: XIAOYIN_EMPLOYEE_ID
        employeeTokenEnv: XIAOYIN_CONTROL_PLANE_TOKEN

    - id: desktop-schedules
      name: '../dist/schedule-plugin.js'
      config:
        readOnly: false

    - id: desktop-skills
      name: '../dist/skill-plugin.js'
      config:
        readOnly: false

    - id: local-files
      name: '../dist/local-files-plugin.js'
      config:
        roots: !!js "(() => { try { const roots = JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]'); return Array.isArray(roots) ? roots : [] } catch { return [] } })()"
        enabled: true
        requireDeleteApproval: true
        readOnly: false

    - id: local-documents
      name: '../dist/local-documents-plugin.js'
      config:
        roots: !!js "(() => { try { const roots = JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]'); return Array.isArray(roots) ? roots : [] } catch { return [] } })()"
        enabled: true
        readOnly: false

    - id: native-shell-policy
      name: '../dist/native-shell-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_ALLOW_SHELL !== 'false'
        requireApproval: !!js process.env.XIAOYIN_APPROVE_SHELL !== 'false'

    - id: local-computer-use
      name: '../dist/local-computer-use-plugin.js'
      config:
        enabled: true
        tools: !!js JSON.parse(process.env.XIAOYIN_COMPUTER_USE_TOOLS ?? '[]')

    - id: local-browser
      name: '../dist/local-browser-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_ALLOW_BROWSER === 'true'
        executable: !!js process.env.XIAOYIN_BROWSER_EXECUTABLE ?? ''
        debugUrl: !!js process.env.XIAOYIN_BROWSER_DEBUG_URL ?? ''
