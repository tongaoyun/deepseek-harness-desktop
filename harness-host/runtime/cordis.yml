# Xiaoyin runtime overlay for the upstream sdk-minimal profile. The profile
# owns the Agent kernel, JSON-RPC server, terminal, subprocess and persistence
# lifecycle; this patch only changes policy and adds product capabilities.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
    streamIdleTimeoutMs: 172800000

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是公司内部办公助手小胤。直接完成用户任务。复杂任务先判断依赖关系，再决定串行、并行或委派；不要把每个技能机械映射成一个 Agent。主 Agent 负责目标、权限、整合与验收，子 Agent 只承担边界清晰且可独立完成的工作。不得让多个 Agent 同时修改同一文件或同一外部资源。只有当前运行时真实提供的工具和连接器才可使用；实时企业数据必须来自成功的工具调用，禁止凭模型知识编造。'

- id: sandbox-policy
  config:
    mode: !!js "process.env.XIAOYIN_EXECUTION_MODE === 'plan' ? 'read-only' : 'danger-full-access'"
    workspaceRoot: !!js process.cwd()

- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 3

- id: jobs
  config:
    maxConcurrentJobsPerOwner: 4

- id: persistent-bash
  disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_EXECUTION_MODE === 'plan' || process.env.XIAOYIN_ALLOW_SHELL === 'false'
  config:
    timeoutMs: 300000
    maxOutputChars: 65536

- id: persistent-pwsh
  disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_EXECUTION_MODE === 'plan' || process.env.XIAOYIN_ALLOW_SHELL === 'false'
  config:
    timeoutMs: 300000
    maxOutputChars: 65536

- id: sessions
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? dshHomePath('sessions')
    compression: none

- insert:
    - id: local-attachments
      name: '../dist/local-attachment-store-plugin.js'
      config:
        root: !!js process.env.XIAOYIN_ATTACHMENT_ROOT ?? './.xiaoyin/attachments'

    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: ask

    - id: desktop-approval
      name: '../dist/desktop-approval-plugin.js'

    - id: session-checkpoints
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    # The catalog is cheap; full SKILL.md bodies enter context only after the
    # model loads a selected or clearly matching skill.
    - id: skills
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: false
        customSkillDirs: !!js JSON.parse(process.env.DSH_CUSTOM_SKILL_DIRS ?? '[]')
        watchFollowSymlinks: false

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    # Continuable children expose stable session ids plus follow-up, stop and
    # inventory controls. A depth cap prevents recursive delegation.
    - id: subagents
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        enableRunInBackground: true
        backgroundMode: continuable
        persona: '你是小胤委派的子 Agent。只完成收到的独立任务，返回事实、产物与验证结果；不要再次委派。'
        toolFilter:
          deny:
            - subagent
            - send_message
            - interrupt_agent
            - list_agents
        maxDepth: 1

    - id: task-outcome
      name: '../dist/task-outcome-plugin.js'

    - id: managed-mcp
      name: '../dist/managed-mcp-plugin.js'
      config:
        connectors: !!js JSON.parse(process.env.XIAOYIN_MCP_CONNECTORS ?? '[]')
        employeeBearerTokenEnv: XIAOYIN_EMPLOYEE_BEARER_TOKEN

    - id: enterprise-knowledge
      name: '../dist/knowledge-plugin.js'
      config:
        endpoint: !!js process.env.XIAOYIN_KNOWLEDGE_ENDPOINT ?? ''
        employeeIdEnv: XIAOYIN_EMPLOYEE_ID
        employeeTokenEnv: XIAOYIN_EMPLOYEE_BEARER_TOKEN

    - id: desktop-schedules
      name: '../dist/schedule-plugin.js'
      config:
        readOnly: !!js process.env.XIAOYIN_EXECUTION_MODE === 'plan'

    - id: desktop-skills
      name: '../dist/skill-plugin.js'
      config:
        readOnly: !!js process.env.XIAOYIN_EXECUTION_MODE === 'plan'

    - id: local-files
      name: '../dist/local-files-plugin.js'
      config:
        roots: !!js JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]')
        enabled: true
        requireDeleteApproval: true
        readOnly: !!js process.env.XIAOYIN_EXECUTION_MODE === 'plan'

    - id: local-documents
      name: '../dist/local-documents-plugin.js'
      config:
        roots: !!js JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]')
        enabled: true
        readOnly: !!js process.env.XIAOYIN_EXECUTION_MODE === 'plan'

    - id: native-shell-policy
      name: '../dist/native-shell-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_EXECUTION_MODE !== 'plan' && process.env.XIAOYIN_ALLOW_SHELL !== 'false'
        requireApproval: !!js process.env.XIAOYIN_APPROVE_SHELL !== 'false'

    - id: local-computer-use
      name: '../dist/local-computer-use-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_EXECUTION_MODE !== 'plan'
        tools: !!js JSON.parse(process.env.XIAOYIN_COMPUTER_USE_TOOLS ?? '[]')

    - id: local-browser
      name: '../dist/local-browser-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_EXECUTION_MODE !== 'plan' && process.env.XIAOYIN_ALLOW_BROWSER === 'true'
        executable: !!js process.env.XIAOYIN_BROWSER_EXECUTABLE ?? ''
        debugUrl: !!js process.env.XIAOYIN_BROWSER_DEBUG_URL ?? ''
