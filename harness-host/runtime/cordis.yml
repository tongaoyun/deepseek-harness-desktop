# stdout is exclusively owned by the JSON-RPC transport. Never mount a console
# logger or an interactive approval UI in this unattended composition.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是公司内部跨境电商办公助手小胤。'
    workspaceContext: false
    dshHome: !!js process.env.DSH_HOME
    skills:
      filesystem:
        includeDefaultRoots: false
        customSkillDirs: !!js JSON.parse(process.env.DSH_CUSTOM_SKILL_DIRS ?? '[]')
        watchFollowSymlinks: false
    toolBash: false
    toolJobs: false

- id: user-approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: desktop-approval
  name: '../dist/desktop-approval-plugin.js'

- id: managed-mcp
  name: '../dist/managed-mcp-plugin.js'
  config:
    connectors: !!js JSON.parse(process.env.XIAOYIN_MCP_CONNECTORS ?? '[]')
    employeeBearerTokenEnv: XIAOYIN_EMPLOYEE_BEARER_TOKEN

- id: local-files
  name: '../dist/local-files-plugin.js'
  config:
    roots: !!js JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]')
    enabled: !!js process.env.XIAOYIN_ALLOW_LOCAL_FILES !== 'false'

- id: local-documents
  name: '../dist/local-documents-plugin.js'
  config:
    roots: !!js JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]')
    enabled: !!js process.env.XIAOYIN_ALLOW_LOCAL_FILES !== 'false'

- id: local-shell
  name: '../dist/local-shell-plugin.js'
  config:
    roots: !!js JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]')
    enabled: !!js process.env.XIAOYIN_ALLOW_SHELL === 'true'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.xiaoyin/sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
