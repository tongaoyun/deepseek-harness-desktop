# stdout is exclusively owned by the JSON-RPC transport. Never mount a console
# logger or an interactive approval UI in this unattended composition.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是公司内部跨境电商办公助手小胤。'
    workspaceContext: false
    dshHome: !!js process.env.DSH_HOME
    skills:
      filesystem:
        includeDefaultRoots: false
        customSkillDirs: !!js JSON.parse(process.env.DSH_CUSTOM_SKILL_DIRS ?? '[]')
        watchFollowSymlinks: false
    toolBash: false
    toolJobs: false

- id: erp-mcp
  name: '../dist/erp-mcp-plugin.js'
  config:
    url: !!js process.env.ERP_MCP_URL ?? ''
    allowedTools: !!js JSON.parse(process.env.ERP_MCP_ALLOWED_TOOLS ?? '[]')
    requiredTools: !!js JSON.parse(process.env.ERP_MCP_REQUIRED_TOOLS ?? '[]')
    bearerTokenEnv: ERP_MCP_BEARER_TOKEN

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.xiaoyin/sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
