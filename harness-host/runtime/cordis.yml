# Xiaoyin policy and product overlay for the upstream full `sdk` profile.
# Stable Harness capabilities stay owned by the official sdk profile; this file
# only replaces deployment policy and adds desktop-owned bridges and business
# tools.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
    # A provider connection that emits no bytes for a full minute is stalled.
    # The desktop can safely retry once while no tool operation has started.
    streamIdleTimeoutMs: 60000

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? '你是公司内部办公助手小胤。始终用用户提问的语言回答，不展示私有思考过程。需要调用工具时，可在操作前用一句自然语言向用户说明当前动作，但不要暴露内部工具名；最终答复只给自包含的结论与交付。先理解用户意图：直接问答或开放式闲聊就自然简短回答，不要求用户补交任务；需要完成具体目标才像 Codex 一样规划、调用工具、核对结果并交付。只有具体执行目标缺少会阻止安全继续的关键信息时才调用 ask_user_question，不要用固定关键词、消息长度或工作目录状态替代意图判断，也不要为普通对话制造等待状态。复杂任务先判断依赖关系，再决定串行、并行或委派；不要把每个技能机械映射成一个 Agent。主 Agent 负责目标、权限、整合与验收，子 Agent 只承担边界清晰且可独立完成的工作。不得让多个 Agent 同时修改同一文件或同一外部资源。只有当前运行时真实提供的工具和连接器才可使用；实时企业数据必须来自成功的工具调用，禁止凭模型知识编造。'

- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 3

# The desktop sets the session cwd to the employee-selected primary workspace.
# Official Harness filesystem tools remain the canonical file surface. The
# Xiaoyin bridge only handles additional authorized roots and product metadata.
- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false

# The Tauri carrier already provides a standalone Node executable. The
# official Python payload is therefore packaged without a duplicate Node copy.
- id: skill-office
  config:
    node: !!js process.execPath

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? dshHomePath('sessions')
    # Match the official profile's default encoding across every supported
    # Node runtime so cold query/recovery paths share one root format.
    compression: zstd

# Keep the official user-settings and credential documents inside the
# employee-scoped DSH_HOME supplied by the desktop process. Explicit paths
# make the isolation contract independent of upstream provider defaults.
- id: settings
  config:
    path: !!js dshHomePath('settings.yaml')

- id: credentials
  config:
    path: !!js dshHomePath('.credentials.yaml')

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-query.sqlite')
    openAt: first-search

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  disabled: !!js process.env.XIAOYIN_ALLOW_SHELL !== 'true'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: ask
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'

- id: bash-sandbox
  disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_ALLOW_SHELL !== 'true'
  config:
    timeoutMs: 300000

- id: pwsh-sandbox
  disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_ALLOW_SHELL !== 'true'

- id: tool-bash
  disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_ALLOW_SHELL !== 'true'

- id: tool-pwsh
  disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_ALLOW_SHELL !== 'true'

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js JSON.parse(process.env.DSH_CUSTOM_SKILL_DIRS ?? '[]')
    watchFollowSymlinks: false

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: true
    backgroundMode: continuable
    persona: '你是小胤委派的子 Agent。只完成收到的独立任务，返回事实、产物与验证结果；不要再次委派。'
    toolFilter:
      deny: [subagent, subagent_fork, send_message, interrupt_agent, list_agents]
    maxDepth: 1

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    maxDepth: 1

- id: tool-result-pruner
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: spill-policy
  config:
    maxInlineBytes: 50000

- id: tool-todo
  config:
    allowParallelInProgress: true

- id: tool-ralph
  disabled: !!js process.env.XIAOYIN_ENABLE_RALPH !== 'true'
  config:
    subagentProvider: spawn
    maxRounds: 32

- id: repeat-tool-reminder
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: web-search-deepseek
  config:
    # Web search uses the Anthropic-compatible DeepSeek endpoint, which may
    # differ from the chat/LiteLLM endpoint used by the desktop task runtime.
    baseURL: !!js process.env.DEEPSEEK_SEARCH_BASE_URL ?? 'https://api.deepseek.com/anthropic/v1'

- insert:
    # Official preset registry owns the composition identity. The Tauri
    # carrier supplies a snapshot hash per Harness process; changing product
    # capabilities therefore creates a new preset and a new Agent scope.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: xiaoyin-default

    - id: xiaoyin-agent-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xiaoyin-default
        plugins: []

    # The SDK JSON-RPC protocol remains the official wire boundary. For a
    # cold persisted session, its create request is adapted to the official
    # Agent Registry resume operation instead of replaying transcript text or
    # patching the upstream SDK server.
    - id: sdk-session-resume
      name: '../dist/sdk-session-resume-plugin.js'

    # Persistent PTY is a separate capability from bounded shell calls. These
    # are product overlay rows because the upstream sdk profile has no terminal
    # rows to replace. Keeping them in insert makes the mount explicit and
    # prevents a silent "entry not found" patch warning.
    - id: tool-bash-persistent
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32' || process.env.XIAOYIN_ALLOW_SHELL !== 'true'
      config:
        enableRunInBackground: true
        maxResultBytes: 262144

    - id: tool-pwsh-persistent
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32' || process.env.XIAOYIN_ALLOW_SHELL !== 'true'
      config:
        enableRunInBackground: true
        maxResultBytes: 262144

    # Official Office skills use `present` for final delivery.
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
      config:
        maxFiles: 8

    # Capture every top-level turn's git and official file-tool changes. The
    # product projection remains responsible for persistence and UI rendering.
    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'
      config:
        maxFiles: 500

    # Canonical dsh-session mentions are resolved by Harness into bounded,
    # immutable, untrusted snapshots. This is read-only cross-session context
    # and does not replace Xiaoyin's task history or product projection.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
      disabled: !!js process.env.XIAOYIN_ENABLE_SESSION_REFERENCES === 'false'
      config:
        maxReferences: 3
        candidateLimit: 50

    - id: desktop-approval
      name: '../dist/desktop-approval-plugin.js'

    - id: desktop-user-question
      name: '../dist/desktop-user-question-plugin.js'

    - id: desktop-plan-mode
      name: '../dist/desktop-plan-mode-plugin.js'

    - id: session-projection-bridge
      name: '../dist/session-projection-plugin.js'

    - id: xiaoyin-product-projections
      name: '../dist/xiaoyin-projections-plugin.js'

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        # Resolve the desktop OS zone in the same Node process that owns the
        # Harness. This yields an IANA name on macOS, Windows and Linux; an
        # invalid or unavailable runtime value falls back deterministically.
        timeZone: !!js "(() => { try { const zone = new Intl.DateTimeFormat().resolvedOptions().timeZone; return typeof zone === 'string' && zone.trim() ? zone : 'Asia/Shanghai' } catch { return 'Asia/Shanghai' } })()"
        refreshIntervalMs: 600000

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
      disabled: !!js process.env.XIAOYIN_ENABLE_SESSION_QUERY_TOOLS === 'false'
      config:
        maxSearchResults: 50
        searchTimeoutMs: 30000

    # Hooks can run arbitrary local commands and therefore require an explicit
    # config path. Missing paths leave no hook listener mounted.
    - id: hooks-codex
      name: '@deepseek-ai/dsh-hooks-codex'
      disabled: !!js "process.env.XIAOYIN_ALLOW_HOOKS === 'false' || !process.env.XIAOYIN_CODEX_HOOKS_CONFIG"
      config:
        configPath: !!js process.env.XIAOYIN_CODEX_HOOKS_CONFIG ?? ''

    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      disabled: !!js "process.env.XIAOYIN_ALLOW_HOOKS === 'false' || !process.env.XIAOYIN_CLAUDE_HOOKS_CONFIG"
      config:
        configPath: !!js process.env.XIAOYIN_CLAUDE_HOOKS_CONFIG ?? ''

    - id: managed-mcp
      name: '../dist/managed-mcp-plugin.js'
      config:
        connectors: !!js JSON.parse(process.env.XIAOYIN_MCP_CONNECTORS ?? '[]')
        employeeBearerTokenEnv: XIAOYIN_EMPLOYEE_BEARER_TOKEN

    - id: enterprise-knowledge
      name: '../dist/knowledge-plugin.js'
      config:
        endpoint: !!js process.env.XIAOYIN_KNOWLEDGE_ENDPOINT ?? ''
        employeeIdEnv: XIAOYIN_EMPLOYEE_ID
        employeeTokenEnv: XIAOYIN_CONTROL_PLANE_TOKEN

    - id: desktop-schedules
      name: '../dist/schedule-plugin.js'
      config:
        readOnly: !!js process.env.XIAOYIN_EXECUTION_MODE === 'plan'

    - id: desktop-skills
      name: '../dist/skill-plugin.js'
      config:
        readOnly: false

    - id: local-files
      name: '../dist/local-files-plugin.js'
      config:
        # The first root is the official Session cwd. Only additional roots
        # need Xiaoyin's multi-root bridge, avoiding duplicate file tools.
        roots: !!js "(() => { try { const roots = JSON.parse(process.env.XIAOYIN_LOCAL_FILE_ROOTS ?? '[]'); return Array.isArray(roots) ? roots.slice(1) : [] } catch { return [] } })()"
        enabled: true
        requireDeleteApproval: true
        readOnly: !!js process.env.XIAOYIN_EXECUTION_MODE === 'plan'

    - id: local-computer-use
      name: '../dist/local-computer-use-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_EXECUTION_MODE !== 'plan'
        tools: !!js JSON.parse(process.env.XIAOYIN_COMPUTER_USE_TOOLS ?? '[]')

    - id: local-browser
      name: '../dist/local-browser-plugin.js'
      config:
        enabled: !!js process.env.XIAOYIN_ALLOW_BROWSER === 'true' && process.env.XIAOYIN_EXECUTION_MODE !== 'plan'
        executable: !!js process.env.XIAOYIN_BROWSER_EXECUTABLE ?? ''
        debugUrl: !!js process.env.XIAOYIN_BROWSER_DEBUG_URL ?? ''
