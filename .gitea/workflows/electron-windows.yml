name: Electron Windows Release

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-desktop package:win:x64
        env:
          CSC_LINK: ${{ secrets.ELECTRON_WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.ELECTRON_WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoyin-electron-windows
          path: apps/desktop/dist/**
