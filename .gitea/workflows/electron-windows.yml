name: Electron Windows

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-x64
    timeout-minutes: 120
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 4
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      DSH_DESKTOP_NPM_REGISTRY: https://registry.npmmirror.com/
      PNPM_STORE_DIR: C:\deepseek-harness-desktop-builder\pnpm-store-electron
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Verify toolchain
        shell: powershell
        run: |
          node --version
          rustc --version
          cargo --version
          if ((node -p "process.arch") -ne "x64") { throw "x64 Node.js is required" }
      - name: Install dependencies
        shell: powershell
        run: |
          npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false --registry=$env:NPM_CONFIG_REGISTRY
          if ($LASTEXITCODE -ne 0) { throw "pnpm installation failed" }
          pnpm config set store-dir $env:PNPM_STORE_DIR
          pnpm install --frozen-lockfile --prefer-offline --registry=$env:NPM_CONFIG_REGISTRY
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed" }
      - name: Prepare package configuration
        shell: powershell
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.instudio.deepseek-harness.desktop
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://deepseek-harness-acceptance.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login-acceptance.invalid"]}'
          '@ | Set-Content -LiteralPath "apps\desktop\.env.windows" -Encoding UTF8
      - name: Build DeepSeek Harness native sidecar
        shell: powershell
        run: |
          cargo test --manifest-path native\deepseek-harness\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "DeepSeek Harness native tests failed" }
          cargo build --release --manifest-path native\deepseek-harness\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "DeepSeek Harness native build failed" }
      - name: Cache locked primary runtime assets
        shell: powershell
        run: powershell -NoProfile -File apps\desktop\scripts\prepare-windows-runtime-cache.ps1
      - name: Package Windows
        shell: powershell
        run: |
          pnpm run package:desktop:win:x64:unsigned
          if ($LASTEXITCODE -ne 0) { throw "Windows Electron packaging failed" }
      - name: Verify Windows artifacts
        shell: powershell
        run: |
          $TargetRoot = "apps\desktop\.desktop-build\targets\win-x64"
          $ArtifactRoot = Join-Path $TargetRoot "unsigned-artifacts"
          $Sidecar = Join-Path $ArtifactRoot "win-unpacked\resources\native\deepseek-harness-native.exe"
          if (-not (Test-Path -LiteralPath $Sidecar -PathType Leaf)) {
            throw "Packaged DeepSeek Harness native sidecar is missing: $Sidecar"
          }
          $Installers = @(Get-ChildItem -LiteralPath $ArtifactRoot -File -Filter "*.exe")
          if ($Installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($Installers.Count)"
          }
          Get-FileHash -LiteralPath $Sidecar -Algorithm SHA256
          Get-FileHash -LiteralPath $Installers[0].FullName -Algorithm SHA256
      - name: Upload Windows artifacts
        uses: http://192.168.2.66:3300/instudio/gitea-upload-artifact@v4
        with:
          name: deepseek-harness-electron-windows-unsigned-${{ github.sha }}
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
          if-no-files-found: error
          retention-days: 30
