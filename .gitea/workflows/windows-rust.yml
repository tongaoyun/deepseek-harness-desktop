name: Windows Rust CI

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".gitea/workflows/windows-rust.yml"
  workflow_dispatch:

concurrency:
  group: xiaoyin-desktop-windows-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\xiaoyin-desktop-builder\ci-target
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://rsproxy.cn/index/
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: 准备 Tauri 静态检查资源目录
        shell: powershell
        run: New-Item -ItemType Directory -Force src-tauri\resources\harness-runtime | Out-Null
      - name: Rust 格式、静态检查和测试
        working-directory: src-tauri
        shell: powershell
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
