name: Windows Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xiaoyin-desktop-windows-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\xiaoyin-desktop-builder\ci-target
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://rsproxy.cn/index/
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: 准备 Tauri 静态检查资源目录
        shell: powershell
        run: New-Item -ItemType Directory -Force src-tauri\resources\harness-runtime | Out-Null
      - name: Rust 格式、静态检查和测试
        working-directory: src-tauri
        shell: powershell
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          # The self-hosted Windows runner currently cannot start Tauri test executables
          # (STATUS_ENTRYPOINT_NOT_FOUND in the machine DLL environment). Compile and link
          # every test target here; the same tests execute in the main CI job.
          cargo test --no-run
          if ($LASTEXITCODE -ne 0) { throw "cargo test compilation failed" }
