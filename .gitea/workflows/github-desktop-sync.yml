name: 同步桌面构建到 GitHub

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 源码提交（留空使用 main）
        required: false
        type: string
      github_run_id:
        description: 重试已有 GitHub 构建的发布（留空重新构建）
        required: false
        type: string
      signing:
        description: unsigned 开发包、internal 免费内部更新、signed 正式签名更新（重试须与原构建一致）
        required: false
        type: choice
        options: [unsigned, internal, signed]
        default: unsigned

concurrency:
  group: github-desktop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ci-node
    timeout-minutes: 180
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/deepseek-harness-desktop-electron:/pnpm-store
    steps:
      - name: Checkout delivery code
        uses: http://192.168.2.67:30330/instudio/checkout@v4
        with:
          ref: ${{ inputs.github_run_id && 'main' || inputs.source_sha || 'main' }}
          fetch-depth: 0
      - name: Fetch stored Harness baseline
        run: |
          tag="$(cat UPSTREAM_TAG)"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
      - name: Install locked dependencies
        env:
          HTTPS_PROXY: ${{ secrets.DESKTOP_GITHUB_PROXY_URL }}
          NODE_USE_ENV_PROXY: '1'
        run: |
          # The Runner can reach npm directly; keep GitHub traffic on the configured proxy.
          export NO_PROXY="${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,::1}},registry.npmjs.org"
          export no_proxy="$NO_PROXY"
          npm install -g pnpm@11.28.5 --prefer-offline --no-audit --fund=false --registry=https://registry.npmjs.org/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/
      - name: Verify source and synchronize
        env:
          GITHUB_DESKTOP_REPOSITORY: ${{ vars.DESKTOP_GITHUB_REPOSITORY }}
          GITHUB_DESKTOP_TOKEN: ${{ secrets.DESKTOP_GITHUB_TOKEN }}
          GITHUB_DOWNLOAD_REPOSITORY: ${{ inputs.signing == 'internal' && vars.DESKTOP_INTERNAL_DOWNLOAD_REPOSITORY || vars.DESKTOP_GITHUB_DOWNLOAD_REPOSITORY }}
          DESKTOP_INTERNAL_CERTIFICATE_SHA256: ${{ vars.DESKTOP_INTERNAL_MAC_CERTIFICATE_SHA256 }}
          GITEA_API_URL: http://192.168.2.67:30330/api/v1
          GITEA_REPOSITORY: instudio/deepseek-harness-desktop
          GITEA_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          GITEA_PASSWORD: ${{ secrets.RELEASE_CREDENTIAL }}
          DESKTOP_BUILD_RUN_ID: ${{ inputs.github_run_id }}
          DESKTOP_SOURCE_SHA: ${{ inputs.source_sha }}
          DESKTOP_SIGNING: ${{ inputs.signing || 'unsigned' }}
          HTTPS_PROXY: ${{ secrets.DESKTOP_GITHUB_PROXY_URL }}
          NODE_USE_ENV_PROXY: '1'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        run: |
          pnpm run verify:upstream
          node --test apps/product-desktop/tests/github-delivery.test.mjs
          node --test apps/product-desktop/tests/desktop-release.test.mjs
          node --test apps/product-desktop/tests/product-updates.test.mjs apps/product-desktop/tests/internal-updates.test.mjs
          node apps/product-desktop/scripts/deliver-desktop.mjs
