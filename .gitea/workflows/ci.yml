name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xiaoyin-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-harness:
    runs-on: ci-node
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/xiaoyin-desktop:/pnpm-store
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: 安装 pnpm 依赖
        run: |
          npm install -g pnpm@10.33.0 --prefer-offline --no-audit --fund=false \
            --registry=http://192.168.2.9:4873/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=http://192.168.2.9:4873/
      - name: 类型、测试和构建
        run: |
          pnpm verify:version
          pnpm typecheck
          pnpm test
          pnpm build

  rust-windows:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\xiaoyin-desktop-builder\ci-target
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://rsproxy.cn/index/
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Rust 格式、静态检查和测试
        working-directory: src-tauri
        shell: powershell
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
