name: 代码检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xiaoyin-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-harness:
    runs-on: ci-node
    timeout-minutes: 30
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/xiaoyin-desktop:/pnpm-store
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: 安装 pnpm 依赖
        run: |
          npm install -g pnpm@10.33.0 --prefer-offline --no-audit --fund=false \
            --registry=http://192.168.2.9:4873/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=http://192.168.2.9:4873/
      - name: Lint、类型、测试和构建
        run: pnpm check:web

  rust-windows:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\xiaoyin-desktop-builder\target
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://rsproxy.cn/index/
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Windows 脚本回归
        shell: powershell
        run: |
          node --test scripts/check-harness-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Harness runtime checker tests failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance-windows.test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop preflight regression failed" }
          foreach ($Script in Get-ChildItem scripts -File -Filter '*.ps1') {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($Script.FullName, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -gt 0) { throw "PowerShell syntax validation failed for $($Script.FullName): $Errors" }
          }
      - name: 准备 Tauri 静态检查资源目录
        shell: powershell
        run: New-Item -ItemType Directory -Force src-tauri\resources\harness-runtime | Out-Null
      - name: Rust 格式、静态检查和测试
        working-directory: src-tauri
        shell: powershell
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
      - name: Windows 进程加载失败诊断
        if: failure()
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/diagnose-windows-loader.ps1
          Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Application Popup'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'xiaoyin|entry|入口' } | Select-Object -First 5 TimeCreated, Message | Format-List
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-1)} -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'xiaoyin_desktop_lib' } | Select-Object -First 5 TimeCreated, Message | Format-List
          exit 0
