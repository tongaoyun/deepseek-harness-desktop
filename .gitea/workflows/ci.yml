name: 代码检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xiaoyin-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-harness:
    runs-on: ci-node
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/xiaoyin-desktop:/pnpm-store
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: 安装 pnpm 依赖
        run: |
          npm install -g pnpm@10.33.0 --prefer-offline --no-audit --fund=false \
            --registry=http://192.168.2.9:4873/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=http://192.168.2.9:4873/
      - name: Lint、类型、测试和构建
        run: |
          pnpm verify:version
          node --test scripts/workflows.test.mjs scripts/macos-build-env.test.mjs scripts/check-harness-runtime.test.mjs scripts/publish-macos-update.test.mjs scripts/verify-updater-signature.test.mjs
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  rust-windows:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\xiaoyin-desktop-builder\target
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://rsproxy.cn/index/
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Windows Harness 验收脚本回归
        shell: powershell
        run: |
          node --test scripts/check-harness-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Harness runtime checker tests failed" }
          foreach ($Script in @('scripts/prepare-harness-runtime.ps1', 'scripts/test-windows-installer.ps1')) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $Script).Path, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -gt 0) { throw "PowerShell syntax validation failed for ${Script}: $Errors" }
          }
      - name: 准备 Tauri 静态检查资源目录
        shell: powershell
        run: New-Item -ItemType Directory -Force src-tauri\resources\harness-runtime | Out-Null
      - name: Rust 格式、静态检查和测试编译
        working-directory: src-tauri
        shell: powershell
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          # This Runner's DLL environment cannot start Tauri tests yet.
          # Compile/link here; the release workflow must still execute them.
          cargo test --no-run
          if ($LASTEXITCODE -ne 0) { throw "cargo test compilation failed" }
