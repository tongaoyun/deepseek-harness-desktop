name: 桌面持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ci-node
    timeout-minutes: 45
    env:
      # Match upstream CI's shared-host budget for cases, hooks and polling.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/deepseek-harness-desktop-electron:/pnpm-store
    steps:
      - name: Checkout
        uses: http://192.168.2.67:30330/instudio/checkout@v4
      - name: Fetch stored Harness baseline
        run: |
          UPSTREAM_TAG="$(cat UPSTREAM_TAG)"
          for attempt in 1 2 3; do
            if timeout 120 git -c http.version=HTTP/1.1 fetch --depth=1 origin \
              "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Install dependencies
        env:
          HTTPS_PROXY: ${{ secrets.DESKTOP_GITHUB_PROXY_URL }}
          NODE_USE_ENV_PROXY: '1'
        run: |
          # npm is reachable directly; reserve the proxy for GitHub and external download hosts.
          export NO_PROXY="${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,::1}},registry.npmjs.org"
          export no_proxy="$NO_PROXY"
          npm install -g pnpm@11.28.5 --prefer-offline --no-audit --fund=false \
            --registry=https://registry.npmjs.org/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Verify upstream and product contracts
        run: |
          pnpm run verify:upstream
          node --test apps/product-desktop/tests/github-delivery.test.mjs
          node --test apps/product-desktop/tests/desktop-release.test.mjs
          node --test apps/product-desktop/tests/product-updates.test.mjs apps/product-desktop/tests/internal-updates.test.mjs apps/product-desktop/tests/native-update-integrity.test.mjs apps/product-desktop/tests/packaging-assembly.test.mjs
          pnpm exec vitest run apps/desktop/tests/desktop-assembly.spec.ts apps/desktop/tests/package-target.spec.ts apps/desktop/tests/desktop-auto-update-environment.spec.ts apps/desktop/tests/desktop-package-environment.spec.ts apps/desktop/tests/desktop-policy-environment.spec.ts apps/desktop/tests/update-coordinator.spec.ts apps/desktop/tests/update-schedule.spec.ts
          node --test apps/product-desktop/tests/acceptance-process.test.mjs apps/product-desktop/tests/office-process-diagnostics.test.mjs
          pnpm exec vitest run apps/product-desktop/tests/close-electron.spec.ts apps/product-desktop/tests/office-fixture.spec.ts
          pnpm run build:artifacts
          node --test apps/product-desktop/tests/company-content.test.mjs
          pnpm run typecheck
          pnpm run rescope-vendor:check
          pnpm run verify-package-dependencies
          pnpm run verify-no-unknown-casts
          # The aggregate product run below owns product/experts/skills tests;
          # build:artifacts already type-checks their Host/Client package projects.
          pnpm exec vitest run \
            packages/deepseek-harness-product \
            packages/extensions/ui-deepseek-harness-product \
            packages/client/ui-sidebar-documentpreview/tests/document-preview-license-bundle.client.spec.ts \
            packages/api/gateway/tests/gateway.client.spec.ts \
            packages/client/ui-settings-general/tests/section-view.client.spec.tsx \
            packages/client/ui-settings-general/tests/settings-root.client.spec.tsx \
            packages/client/ui-settings-general/tests/shell.client.spec.ts \
            packages/client/ui-settings-general/tests/apply.client.spec.ts \
            scripts/upstream-boundaries.spec.ts \
            scripts/build.spec.ts \
            scripts/rescope-vendor.spec.ts \
            scripts/verify-public-repository-links.spec.ts \
            scripts/verify-concrete-terms.spec.ts \
            apps/cli/tests/default-plugin-dump.spec.ts \
            packages/client/hmr/tests/node-half.client.spec.ts \
            packages/client/hmr/tests/transport.client.spec.ts \
            apps/desktop/tests/command-management.spec.ts \
            apps/desktop/tests/crash-report.spec.ts \
            apps/desktop/tests/fatal-recovery.spec.ts \
            apps/desktop/tests/host-process.spec.ts \
            apps/desktop/tests/main-startup.spec.ts \
            apps/desktop/tests/web-document.spec.ts \
            packages/client/ui-primitives/tests/code-file-icon.client.spec.tsx \
            packages/client/ui-settings-account/tests/apply.client.spec.ts \
            scripts/deepseek-harness-electron-workflows.spec.ts
          pnpm run verify-translation-pairing
          git diff --check
