name: Electron Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ci-node
    timeout-minutes: 45
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/deepseek-harness-desktop-electron:/pnpm-store
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Fetch stored Harness baseline
        run: |
          UPSTREAM_TAG="$(cat UPSTREAM_TAG)"
          for attempt in 1 2 3; do
            if timeout 120 git -c http.version=HTTP/1.1 fetch --depth=1 origin \
              "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false \
            --registry=https://registry.npmjs.org/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Verify upstream and product contracts
        run: |
          pnpm run verify:upstream
          node --test scripts/check-upstream-release.test.mjs
          pnpm run build:lib:host
          pnpm run typecheck:contracts-ready
          pnpm exec vitest run \
            scripts/upstream-boundaries.spec.ts \
            packages/deepseek-harness-product/runtime/tests/deepseek-harness-connector-contract.spec.ts \
            packages/deepseek-harness-product/runtime/tests/deepseek-harness-runtime.spec.ts \
            apps/desktop/tests/command-management.spec.ts \
            apps/desktop/tests/crash-report.spec.ts \
            apps/desktop/tests/fatal-recovery.spec.ts \
            apps/desktop/tests/host-process.spec.ts \
            apps/desktop/tests/main-startup.spec.ts \
            packages/client/ui-primitives/tests/code-file-icon.client.spec.tsx \
            packages/client/ui-settings-account/tests/apply.client.spec.ts \
            packages/deepseek-harness-product/product/tests/bridge.spec.ts \
            packages/extensions/ui-deepseek-harness-product/tests/DeepSeekHarnessCatalogSection.spec.tsx \
            scripts/deepseek-harness-electron-workflows.spec.ts
          pnpm run verify-translation-pairing
          git diff --check
