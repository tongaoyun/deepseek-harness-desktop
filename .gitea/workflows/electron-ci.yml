name: Electron Desktop CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ci-node
    timeout-minutes: 45
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/xiaoyin-desktop-electron:/pnpm-store
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false \
            --registry=http://192.168.2.9:4873/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=http://192.168.2.9:4873/
      - name: Verify upstream and product contracts
        run: |
          pnpm run verify:upstream
          pnpm run build:lib:host
          pnpm run typecheck:contracts-ready
          pnpm --dir packages/xiaoyin-product/product test
          pnpm run verify-translation-pairing
          git diff --check
