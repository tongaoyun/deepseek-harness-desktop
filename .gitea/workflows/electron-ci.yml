name: Electron Desktop CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ci-node
    timeout-minutes: 45
    container:
      image: ci-node:1.0.0
      volumes:
        - /data/ci-cache/pnpm/deepseek-harness-desktop-electron:/pnpm-store
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Fetch pinned Harness upstream
        run: |
          UPSTREAM_REPOSITORY="$(cat UPSTREAM_REPOSITORY)"
          UPSTREAM_TAG="$(cat UPSTREAM_TAG)"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          for attempt in 1 2 3; do
            if timeout 120 git -c http.version=HTTP/1.1 fetch --force --depth=1 upstream \
              "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false \
            --registry=https://registry.npmjs.org/
          pnpm config set store-dir /pnpm-store
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Verify upstream and product contracts
        run: |
          pnpm run verify:upstream
          pnpm run build:lib:host
          pnpm run typecheck:contracts-ready
          pnpm --dir packages/deepseek-harness-product/product test
          pnpm run verify-translation-pairing
          git diff --check
