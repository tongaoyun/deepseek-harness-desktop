name: Electron Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new Gitea release tag
        required: true
        type: string
      release_name:
        description: Gitea release display name
        required: true
        type: string

concurrency:
  group: electron-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  GITEA_API_URL: http://192.168.2.66:3300/api/v1
  GITEA_REPOSITORY: ${{ github.repository }}
  GITEA_RELEASE_TAG: ${{ inputs.release_tag }}
  GITEA_RELEASE_NAME: ${{ inputs.release_name }}
  GITEA_RELEASE_COMMIT: ${{ github.sha }}
  GITEA_RELEASE_DRAFT: "true"
  GITEA_RELEASE_DOWNLOAD_ORIGIN: http://192.168.2.66:3300
  GITEA_USERNAME: ${{ secrets.RELEASE_USERNAME }}
  GITEA_PASSWORD: ${{ secrets.RELEASE_CREDENTIAL }}

jobs:
  windows:
    runs-on: windows-x64
    timeout-minutes: 120
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: 4
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      DSH_DESKTOP_NPM_REGISTRY: https://registry.npmmirror.com/
      PNPM_STORE_DIR: C:\\deepseek-harness-desktop-builder\\pnpm-store-electron
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Verify pinned Harness upstream
        shell: powershell
        run: |
          $tag = (Get-Content UPSTREAM_TAG -Raw).Trim()
          $mirror = (Get-Content UPSTREAM_MIRROR_REPOSITORY -Raw).Trim()
          git remote add upstream $mirror
          git fetch --force --depth=1 upstream "refs/tags/$tag:refs/tags/$tag"
          node scripts/verify-upstream.mjs
      - name: Install dependencies
        shell: powershell
        run: |
          if (-not (Get-Command pnpm -ErrorAction SilentlyContinue)) {
            npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false --registry=https://registry.npmjs.org/
          }
          pnpm --version
          pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/
      - name: Prepare package configuration
        shell: powershell
        run: "\"DSH_DESKTOP_APP_ID=com.instudio.deepseek-harness.desktop\" | Set-Content -LiteralPath apps\\desktop\\.env.windows -Encoding UTF8"
      - name: Build native sidecar
        shell: powershell
        run: |
          cargo test --manifest-path native\deepseek-harness\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "DeepSeek Harness native tests failed" }
          cargo build --release --manifest-path native\deepseek-harness\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "DeepSeek Harness native build failed" }
      - name: Cache locked primary runtime assets
        shell: powershell
        run: powershell -NoProfile -File apps\desktop\scripts\prepare-windows-runtime-cache.ps1
      - name: Package Windows unsigned
        shell: powershell
        run: pnpm run package:desktop:win:x64:unsigned
      - name: Verify Windows release
        shell: powershell
        run: |
          $ArtifactRoot = "apps\desktop\.desktop-build\targets\win-x64\unsigned-artifacts"
          $Sidecar = Join-Path $ArtifactRoot "win-unpacked\resources\native\deepseek-harness-native.exe"
          $Installers = @(Get-ChildItem -LiteralPath $ArtifactRoot -File -Filter "*.exe")
          if ($Installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($Installers.Count)" }
          foreach ($Target in @($Installers[0].FullName, (Join-Path $ArtifactRoot "win-unpacked\DeepSeek Harness.exe"), $Sidecar)) {
            if ((Get-AuthenticodeSignature -LiteralPath $Target).Status -ne "NotSigned") {
              throw "Windows release must remain unsigned: $Target"
            }
          }
          pnpm --dir apps/desktop test:installer -- --headless
          if ($LASTEXITCODE -ne 0) { throw "Windows NSIS installer smoke tests failed" }
      - name: Publish Windows assets
        shell: powershell
        run: |
          $Version = node -p "require('./package.json').version"
          node scripts/release/gitea-release.mjs --directory apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts --platform win-x64 --version $Version

  macos:
    needs: windows
    runs-on: macos-arm64
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Verify pinned Harness upstream
        run: |
          tag="$(cat UPSTREAM_TAG)"
          mirror="$(cat UPSTREAM_MIRROR_REPOSITORY)"
          git remote add upstream "$mirror"
          git fetch --force --depth=1 upstream "refs/tags/${tag}:refs/tags/${tag}"
          node scripts/verify-upstream.mjs
      - name: Install dependencies
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false --registry=https://registry.npmjs.org/
          fi
          pnpm --version
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Load runner-owned signing configuration
        run: |
          test -f "$HOME/.deepseek-harness-release/electron/.env.macos"
          cp "$HOME/.deepseek-harness-release/electron/.env.macos" apps/desktop/.env.macos
      - name: Build native sidecar
        run: |
          cargo test --manifest-path native/deepseek-harness/Cargo.toml
          cargo build --release --manifest-path native/deepseek-harness/Cargo.toml
          rustup target add x86_64-apple-darwin
          CARGO_BUILD_TARGET=x86_64-apple-darwin cargo build --release --manifest-path native/deepseek-harness/Cargo.toml
      - name: Package macOS
        run: pnpm run package:desktop:mac:arm64
      - name: Package macOS Intel
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin
          DEEPSEEK_HARNESS_NATIVE_BINARY: ${{ github.workspace }}/native/deepseek-harness/target/x86_64-apple-darwin/release/deepseek-harness-native
        run: pnpm run package:desktop:mac:x64
      - name: Verify macOS release
        run: |
          artifact_root="apps/desktop/.desktop-build/targets/mac-arm64/artifacts"
          intel_artifact_root="apps/desktop/.desktop-build/targets/mac-x64/artifacts"
          test -d "$artifact_root"
          test -d "$intel_artifact_root"
          test "$(find "$artifact_root" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$artifact_root" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$intel_artifact_root" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$intel_artifact_root" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" -eq 1
          find "$artifact_root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -print -quit | grep -q .
          while IFS= read -r file; do shasum -a 256 "$file"; done < <(find "$artifact_root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -print | sort)
      - name: Publish macOS assets
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/release/gitea-release.mjs --directory apps/desktop/.desktop-build/targets/mac-arm64/artifacts --platform mac-arm64 --version "$VERSION"
          GITEA_RELEASE_FINALIZE=true node scripts/release/gitea-release.mjs --directory apps/desktop/.desktop-build/targets/mac-x64/artifacts --platform mac-x64 --version "$VERSION"
