name: Windows 安装包

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_mode:
        description: "release：正式安装包与安装验收；quick：仅生成开发验证用 Debug NSIS"
        required: true
        default: release
        type: choice
        options:
          - release
          - quick
      publish_release:
        description: "从 main 创建正式 Windows Gitea Release；不会触发 macOS 发布"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "正式发布标签，例如 v0.1.69；仅 publish_release=true 时使用"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: write

concurrency:
  group: windows-installer-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'manual' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-windows-x64:
    name: 构建 x64
    runs-on: windows-x64
    timeout-minutes: 120
    env:
      XIAOYIN_BUILD_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || inputs.build_mode == 'quick' && 'quick' || 'release' }}
      XIAOYIN_HARNESS_SMOKE_TIMEOUT_MS: "300000"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: C:\xiaoyin-desktop-builder\target
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://rsproxy.cn/index/
      NPM_CONFIG_REGISTRY: http://192.168.2.9:4873/
      NPM_CONFIG_FETCH_RETRIES: 4
      NPM_CONFIG_FETCH_TIMEOUT: 120000
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      PNPM_STORE_DIR: C:\xiaoyin-desktop-builder\pnpm-store
      XIAOYIN_PRIMARY_RUNTIME_MIRROR: http://192.168.2.66:3300/api/packages/instudio/generic/xiaoyin-primary-runtime
      XIAOYIN_PRIMARY_RUNTIME_SOURCE_MIRROR: http://192.168.2.66:3300/api/packages/instudio/generic/xiaoyin-primary-runtime-source/0.1.7-rc.2
    steps:
      - name: 检出代码
        uses: http://192.168.2.66:3300/instudio/checkout@v4

      - name: 验证 Windows 构建环境
        shell: powershell
        run: |
          git --version
          node --version
          npm --version
          rustc --version
          cargo --version
          if ((node --version) -ne 'v24.19.0') { throw "Node.js v24.19.0 is required" }
          if ((node -p "process.arch") -ne 'x64') { throw "x64 Node.js is required" }
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $Installation) { throw "Microsoft Visual C++ Build Tools is missing" }
          Write-Output "Visual C++ Build Tools: $Installation"

      - name: 安装锁定依赖
        shell: powershell
        run: |
          .\scripts\ensure-pnpm.ps1
          pnpm config set store-dir $env:PNPM_STORE_DIR
          pnpm install --frozen-lockfile --prefer-offline --registry=http://192.168.2.9:4873/
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed" }
          pnpm verify:version
          if ($LASTEXITCODE -ne 0) { throw "version consistency check failed" }

      - name: 验证正式版本标签
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        run: node scripts/verify-release-ref.mjs

      - name: 准备内置 Harness Runtime
        if: ${{ env.XIAOYIN_BUILD_MODE == 'release' }}
        shell: powershell
        run: .\scripts\prepare-harness-runtime.ps1

      - name: 准备 Tauri Windows 打包工具
        shell: powershell
        run: |
          if ($env:XIAOYIN_BUILD_MODE -eq 'quick') {
            .\scripts\prepare-tauri-windows-tools.ps1 -Bundles nsis
          } else {
            .\scripts\prepare-tauri-windows-tools.ps1
          }

      - name: 构建所选 Windows 安装包
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $Profile = if ($env:XIAOYIN_BUILD_MODE -eq 'quick') { 'debug' } else { 'release' }
          $Bundle = Join-Path $env:CARGO_TARGET_DIR "$Profile\bundle"
          if (Test-Path -LiteralPath $Bundle) { Remove-Item -LiteralPath $Bundle -Recurse -Force }
          if ($env:XIAOYIN_BUILD_MODE -eq 'quick') {
            pnpm tauri build --debug --features windows-no-console --bundles nsis --config src-tauri/tauri.quick.windows.conf.json
          } else {
            $Runtime = Join-Path (Get-Location).Path "src-tauri\resources\harness-runtime"
            if (-not (Test-Path -LiteralPath (Join-Path $Runtime "runtime-manifest.json") -PathType Leaf)) {
              throw "Prepared Harness runtime is missing"
            }
            $LinkRoot = "C:\xh"
            New-Item -ItemType Directory -Force -Path $LinkRoot | Out-Null
            $Link = Join-Path $LinkRoot ([guid]::NewGuid().ToString("N").Substring(0, 8))
            New-Item -ItemType Junction -Path $Link -Target $Runtime | Out-Null
            $ConfigPath = "$Link.json"
            try {
              $Resources = @{}
              $Resources[(($Link -replace "\\", "/") + "/")] = "resources/harness-runtime/"
              $Config = @{ bundle = @{ resources = $Resources } } | ConvertTo-Json -Depth 4 -Compress
              [System.IO.File]::WriteAllText($ConfigPath, $Config, [System.Text.UTF8Encoding]::new($false))
              pnpm tauri build --verbose --config $ConfigPath
              $BuildExitCode = $LASTEXITCODE
            } finally {
              if (Test-Path -LiteralPath $ConfigPath) { Remove-Item -LiteralPath $ConfigPath -Force }
              [System.IO.Directory]::Delete($Link)
            }
            if ($BuildExitCode -ne 0) { throw "Windows installer build failed" }
          }
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }

      - name: NSIS 安装与内置 Harness 烟测
        if: ${{ env.XIAOYIN_BUILD_MODE == 'release' }}
        shell: powershell
        env:
          XIAOYIN_WINDOWS_SMOKE: "1"
        run: |
          $Bundle = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $ExpectedVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $VersionPattern = "(^|_)$([regex]::Escape($ExpectedVersion))(?=_|-|\.)"
          $Installers = @(Get-ChildItem $Bundle -Recurse -File -Filter "*.exe" | Where-Object { $_.Name -match $VersionPattern })
          if ($Installers.Count -ne 1) { throw "Expected one NSIS installer, found $($Installers.Count)" }
          $InstallerPath = Join-Path -Path (Get-Location).Path -ChildPath "xiaoyin-installer-smoke.exe"
          try {
            if (Test-Path -LiteralPath $InstallerPath -PathType Leaf) { Remove-Item -LiteralPath $InstallerPath -Force }
            Copy-Item -LiteralPath $Installers[0].FullName -Destination $InstallerPath
            if (-not (Test-Path -LiteralPath $InstallerPath -PathType Leaf)) { throw "NSIS smoke copy was not created: $InstallerPath" }
            .\scripts\test-windows-installer.ps1
          } finally {
            if (Test-Path -LiteralPath $InstallerPath -PathType Leaf) { Remove-Item -LiteralPath $InstallerPath -Force }
          }

      - name: 收集安装包并生成 SHA-256 清单
        shell: powershell
        run: |
          $Quick = $env:XIAOYIN_BUILD_MODE -eq 'quick'
          $Profile = if ($Quick) { 'debug' } else { 'release' }
          $Bundle = Join-Path $env:CARGO_TARGET_DIR "$Profile\bundle"
          $Output = Join-Path (Get-Location).Path "windows-artifacts"
          $ExpectedVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $VersionPattern = "(^|_)$([regex]::Escape($ExpectedVersion))(?=_|-|\.)"
          $Files = @(Get-ChildItem $Bundle -Recurse -File | Where-Object {
            $_.Extension -in @(".exe", ".msi") -and $_.Name -match $VersionPattern
          })
          $ExpectedCount = if ($Quick) { 1 } else { 2 }
          if ($Files.Count -ne $ExpectedCount) { throw "Expected $ExpectedCount installers, found $($Files.Count)" }
          if (Test-Path -LiteralPath $Output) { Remove-Item -LiteralPath $Output -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $Output | Out-Null
          foreach ($File in $Files) {
            Copy-Item -LiteralPath $File.FullName -Destination (Join-Path $Output $File.Name)
            $Signature = "$($File.FullName).sig"
            if (-not (Test-Path -LiteralPath $Signature -PathType Leaf)) {
              if (-not $Quick) { throw "Updater signature is missing: $Signature" }
            } else {
              Copy-Item -LiteralPath $Signature -Destination (Join-Path $Output (Split-Path $Signature -Leaf))
            }
          }
          $ChecksumLines = @(Get-ChildItem $Output -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" })
          $Utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $Output "SHA256SUMS.txt"), (($ChecksumLines -join "`n") + "`n"), $Utf8WithoutBom)

      - name: 发布正式版本到 Gitea Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
        shell: powershell
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_CREDENTIAL: ${{ secrets.RELEASE_CREDENTIAL }}
          XIAOYIN_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $Tag = if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "True") { $env:GITHUB_REF_NAME } else { $env:XIAOYIN_RELEASE_TAG }
          if ([string]::IsNullOrWhiteSpace($Tag)) { throw "release_tag is required for a manual formal release" }
          .\scripts\publish-gitea-release.ps1 -Tag $Tag

      - name: 上传 Windows 安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publish_release != true }}
        uses: http://192.168.2.66:3300/instudio/gitea-upload-artifact@v4
        with:
          name: xiaoyin-desktop-windows-${{ env.XIAOYIN_BUILD_MODE }}-x64-${{ github.sha }}
          path: |
            windows-artifacts/*.exe
            windows-artifacts/*.msi
            windows-artifacts/*.sig
            windows-artifacts/SHA256SUMS.txt
            windows-artifacts/RELEASE-SHA256SUMS.txt
            windows-artifacts/release-manifest.json
            windows-artifacts/latest.json
          if-no-files-found: error
          retention-days: 30
