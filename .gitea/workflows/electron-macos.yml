name: Electron macOS Release

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-arm64
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: http://192.168.2.66:3300/instudio/checkout@v4
      - name: Install dependencies
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@11.7.0 --prefer-offline --no-audit --fund=false \
              --registry=https://registry.npmjs.org/
          fi
          pnpm --version
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Load runner-owned signing configuration
        run: |
          release_config="$HOME/.deepseek-harness-release/electron/.env.macos"
          test -f "$release_config" || { echo "Missing runner-owned $release_config" >&2; exit 1; }
          cp "$release_config" apps/desktop/.env.macos
      - name: Build DeepSeek Harness native sidecar
        run: |
          cargo test --manifest-path native/deepseek-harness/Cargo.toml
          cargo build --release --manifest-path native/deepseek-harness/Cargo.toml
      - name: Package macOS
        run: pnpm run package:desktop:mac:arm64
      - name: Verify macOS artifacts
        run: |
          artifact_root="apps/desktop/.desktop-build/targets/mac-arm64/artifacts"
          test -d "$artifact_root"
          find "$artifact_root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -print -quit | grep -q .
          while IFS= read -r file; do shasum -a 256 "$file"; done < <(find "$artifact_root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -print | sort)
      - name: Upload macOS artifacts
        uses: http://192.168.2.66:3300/instudio/gitea-upload-artifact@v4
        with:
          name: deepseek-harness-electron-macos-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/mac-arm64/artifacts/**
          if-no-files-found: error
          retention-days: 30
