packages:
  - harness-host

injectWorkspacePackages: true

supportedArchitectures:
  os: [current]
  cpu: [current, arm64, x64]

overrides:
  js-yaml: 4.3.2
  uuid: 11.1.1
  '@deepseek-ai/dsh': 0.1.7-rc.2
  '@deepseek-ai/dsh-sdk-protocol': 0.1.7-rc.2

onlyBuiltDependencies:
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - esbuild
  - koffi
  - node-pty
  - protobufjs

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
