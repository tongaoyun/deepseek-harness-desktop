packages:
  - harness-host

injectWorkspacePackages: true

supportedArchitectures:
  os: [current]
  cpu: [current, arm64, x64]

overrides:
  js-yaml: 4.3.2
  uuid: 11.1.1

onlyBuiltDependencies:
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - esbuild
  - koffi
  - node-pty
  - protobufjs

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

patchedDependencies:
  '@deepseek-ai/dsh-llm-deepseek@0.1.5-rc.2': patches/@deepseek-ai__dsh-llm-deepseek@0.1.5-rc.2.patch
  "@deepseek-ai/dsh-sdk-jsonrpc-server@0.1.5-rc.2": patches/@deepseek-ai__dsh-sdk-jsonrpc-server@0.1.5-rc.2.patch
