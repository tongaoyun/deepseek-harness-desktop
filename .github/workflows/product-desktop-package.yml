name: Product desktop packages
run-name: Desktop ${{ inputs.source_sha }} / ${{ inputs.delivery_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact desktop source commit
        type: string
        required: true
      delivery_id:
        description: Internal delivery correlation ID
        type: string
        required: false
      signing:
        description: unsigned 开发包、internal 免费内部更新、signed 正式签名更新
        type: choice
        options: [unsigned, internal, signed]
        default: unsigned

permissions:
  contents: read
  actions: read

concurrency:
  group: product-desktop-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch stored Harness baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          tag="$(cat UPSTREAM_TAG)"
          git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate signing machine configuration
        env:
          PACKAGE_SIGNING: ${{ inputs.signing }}
          PACKAGE_DOWNLOAD_REPOSITORY: ${{ inputs.signing == 'internal' && vars.DESKTOP_INTERNAL_DOWNLOAD_REPOSITORY || vars.DESKTOP_GITHUB_DOWNLOAD_REPOSITORY }}
          SIGNED_DOWNLOAD_REPOSITORY: ${{ vars.DESKTOP_GITHUB_DOWNLOAD_REPOSITORY }}
          PACKAGE_INTERNAL_CERTIFICATE_SHA256: ${{ vars.DESKTOP_INTERNAL_MAC_CERTIFICATE_SHA256 }}
          INTERNAL_CERTIFICATE_CONFIGURED: ${{ secrets.DESKTOP_INTERNAL_MAC_CERTIFICATE != '' && secrets.DESKTOP_INTERNAL_MAC_PASSWORD != '' }}
          SIGNING_RUNNERS: ${{ vars.DESKTOP_SIGNING_RUNNERS }}
          SIGNING_CONFIG_DIRS: ${{ vars.DESKTOP_SIGNING_CONFIG_DIRS }}
        run: node apps/product-desktop/scripts/signing-runners.mjs
      # These checks are source-wide and identical for every target. Keeping
      # them here avoids running the same suite three times on release hosts.
      - name: Verify upstream and product delivery contracts
        run: pnpm run verify:upstream
      - name: Test product source synchronization
        run: node --test apps/product-desktop/tests/github-delivery.test.mjs
      - name: Test native product update publication
        run: node --test apps/product-desktop/tests/product-updates.test.mjs apps/product-desktop/tests/internal-updates.test.mjs apps/product-desktop/tests/native-update-integrity.test.mjs apps/product-desktop/tests/packaging-assembly.test.mjs
      - name: Test native update confirmation and configuration
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/desktop-auto-update-environment.spec.ts
          apps/desktop/tests/desktop-package-environment.spec.ts
          apps/desktop/tests/desktop-policy-environment.spec.ts
          apps/desktop/tests/update-coordinator.spec.ts
          apps/desktop/tests/update-schedule.spec.ts
      - name: Test acceptance process cleanup
        run: node --test apps/product-desktop/tests/acceptance-process.test.mjs apps/product-desktop/tests/office-process-diagnostics.test.mjs
      - name: Test Electron close lifecycle
        run: pnpm exec vitest run apps/product-desktop/tests/close-electron.spec.ts apps/product-desktop/tests/office-fixture.spec.ts apps/product-desktop/tests/native-update-dialog.spec.ts
      - name: Test upstream boundaries
        run: pnpm exec vitest run scripts/upstream-boundaries.spec.ts scripts/build.spec.ts apps/desktop/tests/desktop-package-plan.spec.ts apps/desktop/tests/package-target-stages.spec.ts apps/desktop/tests/pack-local-packages.spec.ts scripts/release/pack.spec.ts apps/desktop/tests/prepare-package-set.spec.ts
      - name: Test product sidecar
        run: cargo test --manifest-path native/deepseek-harness/Cargo.toml
  package:
    needs: preflight
    name: ${{ matrix.target }} ${{ inputs.signing }}
    runs-on: ${{ inputs.signing == 'signed' && fromJSON(vars.DESKTOP_SIGNING_RUNNERS || '{}')[matrix.target] || matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2025
            arch: x64
          - target: mac-arm64
            runner: macos-15
            arch: arm64
          - target: mac-x64
            runner: macos-15-intel
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      DSH_DESKTOP_NPM_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: '4'
      PACKAGE_SIGNING: ${{ inputs.signing }}
      PACKAGE_DOWNLOAD_REPOSITORY: ${{ inputs.signing == 'internal' && vars.DESKTOP_INTERNAL_DOWNLOAD_REPOSITORY || vars.DESKTOP_GITHUB_DOWNLOAD_REPOSITORY }}
      PACKAGE_INTERNAL_CERTIFICATE_SHA256: ${{ vars.DESKTOP_INTERNAL_MAC_CERTIFICATE_SHA256 }}
      PACKAGE_SIGNING_CONFIG_DIR: ${{ inputs.signing == 'signed' && fromJSON(vars.DESKTOP_SIGNING_CONFIG_DIRS || '{}')[matrix.target] || '' }}
      DSH_DESKTOP_UPDATE_CHANNEL: nightly
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read package build date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_date="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          printf 'PACKAGE_BUILD_DATE=%s\n' "$build_date" >> "$GITHUB_ENV"
      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure desktop cache directories
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { join } from 'node:path'
          for (const [key, directory] of [
            ['DSH_DESKTOP_PACKAGE_CACHE_DIR', 'harness-desktop-package-cache'],
            ['ELECTRON_BUILDER_CACHE', 'harness-desktop-builder-cache'],
            ['CARGO_TARGET_DIR', 'harness-desktop-rust'],
            ['PNPM_CONFIG_CACHE_DIR', 'harness-pnpm-metadata-cache'],
          ]) appendFileSync(process.env.GITHUB_ENV, `${key}=${join(process.env.RUNNER_TEMP, directory)}\n`)
          NODE
      - name: Cache desktop downloads and package store
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ${{ env.PNPM_CONFIG_CACHE_DIR }}
          key: desktop-downloads-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/primary-runtime/lock.json') }}
          restore-keys: |
            desktop-downloads-v1-${{ runner.os }}-${{ matrix.target }}-
      - name: Cache Rust compilation
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: desktop-rust-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('native/deepseek-harness/Cargo.lock', 'native/deepseek-harness/Cargo.toml', 'native/deepseek-harness/src/**', 'native/deepseek-harness/build.rs') }}
          restore-keys: |
            desktop-rust-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify source and native architecture
        env:
          PACKAGE_SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: node apps/product-desktop/scripts/github-package.mjs prepare
      - name: Test Windows packaging arguments
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: node --test apps/product-desktop/tests/windows-package-arguments.test.mjs
      - name: Package Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          [string[]]$ModeArgs = if ($env:PACKAGE_SIGNING -eq 'signed') { @() } else { @('--unsigned') }
          pnpm --dir apps/product-desktop run package win-x64 @ModeArgs --build-version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - name: Package macOS
        if: matrix.target != 'win-x64'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_INTERNAL_CERTIFICATE_BASE64: ${{ inputs.signing == 'internal' && secrets.DESKTOP_INTERNAL_MAC_CERTIFICATE || '' }}
          PACKAGE_INTERNAL_CERTIFICATE_PASSWORD: ${{ inputs.signing == 'internal' && secrets.DESKTOP_INTERNAL_MAC_PASSWORD || '' }}
        run: |
          mode_args=()
          if [ "$PACKAGE_SIGNING" != signed ]; then mode_args+=(--unsigned); fi
          pnpm --dir apps/product-desktop run package "$PACKAGE_TARGET" "${mode_args[@]}" --build-version "$PACKAGE_VERSION"
      - name: Test builtin product capabilities
        run: >-
          pnpm exec vitest run
          packages/deepseek-harness-product/desktop/tests/builtin-capabilities.spec.ts
          packages/deepseek-harness-product/desktop/tests/company-plugins.spec.ts
      - name: Test archived Host startup
        run: >-
          pnpm exec vitest run --config vitest.e2e.config.ts
          apps/desktop/tests/host-process-archive.built.e2e.ts --retry=0
      - name: Validate Windows signatures and installer lifecycle
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ArtifactRoot = "apps/desktop/.desktop-build/targets/win-x64/$env:PACKAGE_ARTIFACT_DIRECTORY"
          $Installers = @(Get-ChildItem -LiteralPath $ArtifactRoot -File -Filter '*.exe')
          if ($Installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $Files = @($Installers[0].FullName,
            (Join-Path $ArtifactRoot 'win-unpacked/DeepSeek Harness.exe'),
            (Join-Path $ArtifactRoot 'win-unpacked/resources/native/deepseek-harness-native.exe'))
          foreach ($File in $Files) {
            $Expected = if ($env:PACKAGE_SIGNING -eq 'signed') { 'Valid' } else { 'NotSigned' }
            if ((Get-AuthenticodeSignature -LiteralPath $File).Status -ne $Expected) {
              throw "Unexpected artifact signature: $File"
            }
          }
          pnpm --dir apps/desktop test:installer -- --headless
          if ($LASTEXITCODE -ne 0) { throw 'Installer lifecycle smoke failed' }
      - name: Test native Electron UI profiles
        env:
          DSH_DESKTOP_SMOKE: '1'
          DSH_SNAPSHOT: replay
        run: >-
          pnpm exec vitest run --config vitest.web.config.ts
          apps/web/tests/deepseek-harness-catalog.e2e.ts
          -t 'boots the built .* Electron assembly'
          --reporter=default --reporter=json
          --outputFile=.artifacts/desktop-ui-${{ matrix.target }}.json
      - name: Test installed product desktop
        if: matrix.target != 'win-x64'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_INTERNAL_CERTIFICATE_BASE64: ${{ inputs.signing == 'internal' && secrets.DESKTOP_INTERNAL_MAC_CERTIFICATE || '' }}
          PACKAGE_INTERNAL_CERTIFICATE_PASSWORD: ${{ inputs.signing == 'internal' && secrets.DESKTOP_INTERNAL_MAC_PASSWORD || '' }}
        run: pnpm --dir apps/product-desktop run test:installed --target "$PACKAGE_TARGET"
      - name: Test installed Windows product desktop
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          pnpm --dir apps/product-desktop run test:installed --target win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop UI acceptance failed' }
      - name: Upload desktop UI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness-desktop-ui-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/desktop-ui-${{ matrix.target }}.json
            .artifacts/desktop-installed-${{ matrix.target }}.json
            .artifacts/native-macos-update-*.json
            .artifacts/native-windows-update-*.json
            .artifacts/deepseek-harness-catalog/electron-*.png
            .artifacts/deepseek-harness-catalog/electron-*-startup.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness-packaging-failure-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            apps/desktop/.desktop-build/packaging-runs/**/events.jsonl
            apps/desktop/.desktop-build/packaging-runs/**/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Record verified artifact checksums
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: node apps/product-desktop/scripts/github-package.mjs artifacts
      - name: Upload installers
        uses: actions/upload-artifact@v7.0.1
        with:
          name: harness-${{ matrix.target }}-${{ inputs.signing }}-${{ github.run_number }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ env.PACKAGE_ARTIFACT_DIRECTORY }}/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ env.PACKAGE_ARTIFACT_DIRECTORY }}/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ env.PACKAGE_ARTIFACT_DIRECTORY }}/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ env.PACKAGE_ARTIFACT_DIRECTORY }}/*.blockmap
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ env.PACKAGE_ARTIFACT_DIRECTORY }}/*-nightly.yml
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/${{ env.PACKAGE_ARTIFACT_DIRECTORY }}/build-manifest.json
          if-no-files-found: error
          retention-days: 1
